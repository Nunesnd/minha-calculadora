<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Calculadora simples, rápida e instalável.">
  <title>Calculadora</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator">
    <header class="top-bar">
      <button
        id="btn-theme"
        class="theme-button"
        type="button"
        aria-label="Alterar tema"
        title="Alterar tema"
      >
        <span aria-hidden="true">◐</span>
        <span id="theme-label">Clássico</span>
      </button>

      <button id="btn-install" class="install-button" type="button" hidden>
        📲 Instalar app
      </button>
    </header>

    <section class="display" aria-label="Visor da calculadora" aria-live="polite">
      <div id="history-display" class="history-display"></div>
      <div id="main-display" class="main-display">0</div>
    </section>

    <section class="keypad" aria-label="Teclado da calculadora">
      <button type="button" data-action="clear" class="key key-function key-clear">C</button>
      <button type="button" data-action="sign" class="key key-function">+/-</button>
      <button type="button" data-action="percent" class="key key-function">%</button>
      <button type="button" data-operator="/" class="key key-operator">÷</button>

      <button type="button" data-digit="7" class="key key-number">7</button>
      <button type="button" data-digit="8" class="key key-number">8</button>
      <button type="button" data-digit="9" class="key key-number">9</button>
      <button type="button" data-operator="*" class="key key-operator">×</button>

      <button type="button" data-digit="4" class="key key-number">4</button>
      <button type="button" data-digit="5" class="key key-number">5</button>
      <button type="button" data-digit="6" class="key key-number">6</button>
      <button type="button" data-operator="-" class="key key-operator">−</button>

      <button type="button" data-digit="1" class="key key-number">1</button>
      <button type="button" data-digit="2" class="key key-number">2</button>
      <button type="button" data-digit="3" class="key key-number">3</button>
      <button type="button" data-operator="+" class="key key-operator">+</button>

      <button type="button" data-action="backspace" class="key key-function">⌫</button>
      <button type="button" data-digit="0" class="key key-number">0</button>
      <button type="button" data-action="decimal" class="key key-number">,</button>
      <button type="button" data-action="equals" class="key key-equals">=</button>
    </section>
  </main>
</body>
</html>
