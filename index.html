<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Simulador de Calculadora Financeira RPN.">
  <title>Calculadora Financeira RPN</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="hp-calculator">
    <header class="top-bar">
      <div class="brand-title">FINANCIAL RPN</div>
      <button id="btn-theme" class="theme-button" type="button" aria-label="Alterar tema">
        <span aria-hidden="true">◐</span>
        <span id="theme-label">Clássico</span>
      </button>
      <button id="btn-install" class="install-button" type="button" hidden>
        📲 Instalar Calculadora
      </button>
    </header>

    <section class="lcd-display" aria-label="Visor da calculadora" aria-live="polite">
      <div id="modifier-status" class="status-bar"></div>
      <div id="main-display" class="main-display">0.00</div>
    </section>

    <section class="keypad" aria-label="Teclado da calculadora">
      <!-- Linha 1 -->
      <div class="key-container">
        <span class="label-f">AMORT</span>
        <button class="key" data-action="n">
          <span class="key-main">n</span>
          <span class="key-sub">12×</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f">INT</span>
        <button class="key key-gold-top" data-action="i">
          <span class="key-main">i</span>
          <span class="key-sub">12÷</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f">NPV</span>
        <button class="key key-gold-top" data-action="PV">
          <span class="key-main">PV</span>
          <span class="key-sub">CFo</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f">RND</span>
        <button class="key key-gold-top" data-action="PMT">
          <span class="key-main">PMT</span>
          <span class="key-sub">CFj</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f">IRR</span>
        <button class="key key-gold-top" data-action="FV">
          <span class="key-main">FV</span>
          <span class="key-sub">Nj</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f">RPN</span>
        <button class="key" data-action="CHS">
          <span class="key-main">CHS</span>
          <span class="key-sub">DATE</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-digit="7">
          <span class="key-main">7</span>
          <span class="key-sub">BEG</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-digit="8">
          <span class="key-main">8</span>
          <span class="key-sub">END</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-digit="9">
          <span class="key-main">9</span>
          <span class="key-sub">MEM</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key key-operator" data-operator="/">
          <span class="key-main">÷</span>
          <span class="key-sub">↶</span>
        </button>
      </div>

      <!-- Linha 2 -->
      <div class="key-container">
        <span class="label-f-titulo">BOND</span>
        <span class="label-f">PRICE</span>
        <button class="key" data-action="power">
          <span class="key-main">yˣ</span>
          <span class="key-sub">√x</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f-titulo">BOND</span>
        <span class="label-f">YTM</span>
        <button class="key" data-action="reciprocal">
          <span class="key-main">1/x</span>
          <span class="key-sub">eˣ</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f-titulo">DEPR</span>
        <span class="label-f">SL</span>
        <button class="key" data-action="pct_total">
          <span class="key-main">%T</span>
          <span class="key-sub">LN</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f-titulo">DEPR</span>
        <span class="label-f">SOYD</span>
        <button class="key" data-action="pct_delta">
          <span class="key-main">Δ%</span>
          <span class="key-sub">FRAC</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f-titulo">DEPR</span>
        <span class="label-f">DB</span>
        <button class="key" data-action="percent">
          <span class="key-main">%</span>
          <span class="key-sub">INTG</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f-titulo"></span>
        <span class="label-f">ALG</span>
        <button class="key" data-action="EEX">
          <span class="key-main">EEX</span>
          <span class="key-sub">ΔDYS</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-digit="4">
          <span class="key-main">4</span>
          <span class="key-sub">D.MY</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-digit="5">
          <span class="key-main">5</span>
          <span class="key-sub">M.DY</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-digit="6">
          <span class="key-main">6</span>
          <span class="key-sub">x̄ W</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key key-operator" data-operator="*">
          <span class="key-main">×</span>
          <span class="key-sub">x²</span>
        </button>
      </div>

      <!-- Linha 3 -->
      <div class="key-container">
        <span class="label-f-titulo"></span>
        <span class="label-f">P/R</span>
        <button class="key" data-action="RS">
          <span class="key-main">R/S</span>
          <span class="key-sub">PSE</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f-titulo">CLEAR</span>
        <span class="label-f">Σ</span>
        <button class="key" data-action="SST">
          <span class="key-main">SST</span>
          <span class="key-sub">BST</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f-titulo">CLEAR</span>
        <span class="label-f">PRGM</span>
        <button class="key" data-action="roll_down">
          <span class="key-main">R↓</span>
          <span class="key-sub">GTO</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f-titulo">CLEAR</span>
        <span class="label-f">FIN</span>
        <button class="key" data-action="swap">
          <span class="key-main">x≷y</span>
          <span class="key-sub">x≤y</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f-titulo">CLEAR</span>
        <span class="label-f">REG</span>
        <button class="key" data-action="CLx">
          <span class="key-main">CLx</span>
          <span class="key-sub">x=0</span>
        </button>
      </div>

      <!-- ENTER (Sem .key-sub, chanfro calculado em pixels exatos via CSS) -->
      <div class="key-container key-container-enter">
        <span class="label-f-titulo">CLEAR</span>
        <span class="label-f">PREFIX</span>
        <button class="key key-enter" data-action="ENTER">
          <span class="key-main">ENTER</span>
          <span class="key-enter-sub">=</span>
        </button>
      </div>

      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-digit="1">
          <span class="key-main">1</span>
          <span class="key-sub">x̂,r</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-digit="2">
          <span class="key-main">2</span>
          <span class="key-sub">ŷ,r</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-digit="3">
          <span class="key-main">3</span>
          <span class="key-sub">n!</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key key-operator" data-operator="-">
          <span class="key-main">−</span>
          <span class="key-sub">←</span>
        </button>
      </div>

      <!-- Linha 4 -->
      <div class="key-container">
        <span class="label-f">OFF</span>
        <button class="key key-on" data-action="ON">ON</button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key key-modifier-f" data-action="prefix_f">
          <span class="key-main">f</span>
          <span class="key-sub"></span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key key-modifier-g" data-action="prefix_g">
          <span class="key-main">g</span>
          <span class="key-sub"></span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-action="STO">
          <span class="key-main">STO</span>
          <span class="key-sub">(</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-action="RCL">
          <span class="key-main">RCL</span>
          <span class="key-sub">)</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-digit="0">
          <span class="key-main">0</span>
          <span class="key-sub">x̄</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-action="decimal">
          <span class="key-main">.</span>
          <span class="key-sub">s</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key" data-action="sigma_plus">
          <span class="key-main">Σ+</span>
          <span class="key-sub">Σ-</span>
        </button>
      </div>
      <div class="key-container">
        <span class="label-f"></span>
        <button class="key key-operator" data-operator="+">
          <span class="key-main">+</span>
          <span class="key-sub">LST x</span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
