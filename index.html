<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Simulador de Calculadora Financeira RPN.">
  <title>Calculadora Financeira RPN</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="hp-calculator">
    <header class="top-bar">
      <div class="brand-title">FINANCIAL RPN</div>
      <button id="btn-theme" class="theme-button" type="button" aria-label="Alterar tema">
        <span aria-hidden="true">◐</span>
        <span id="theme-label">Clássico</span>
      </button>
      <button id="btn-install" class="install-button" type="button" hidden>
        📲 Instalar Calculadora
      </button>
    </header>

    <section class="lcd-display" aria-label="Visor da calculadora" aria-live="polite">
      <div id="modifier-status" class="status-bar"></div>
      <div id="main-display" class="main-display">0.00</div>
    </section>

    <section class="keypad" aria-label="Teclado da calculadora">
      <!-- Linha 1 -->
      <div class="key-container"><span class="label-f">AMORT</span><button class="key key-gold-top" data-action="n">n</button><span class="label-g">12×</span></div>
      <div class="key-container"><span class="label-f">INT</span><button class="key key-gold-top" data-action="i">i</button><span class="label-g">12÷</span></div>
      <div class="key-container"><span class="label-f">NPV</span><button class="key key-gold-top" data-action="PV">PV</button><span class="label-g">CFo</span></div>
      <div class="key-container"><span class="label-f">RND</span><button class="key key-gold-top" data-action="PMT">PMT</button><span class="label-g">CFj</span></div>
      <div class="key-container"><span class="label-f">IRR</span><button class="key key-gold-top" data-action="FV">FV</button><span class="label-g">Nj</span></div>
      <div class="key-container"><span class="label-f">RPN</span><button class="key" data-action="CHS">CHS</button><span class="label-g">DATE</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-digit="7">7</button><span class="label-g">BEG</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-digit="8">8</button><span class="label-g">END</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-digit="9">9</button><span class="label-g">MEM</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key key-operator" data-operator="/">÷</button><span class="label-g"></span></div>

      <!-- Linha 2 -->
      <div class="key-container"><span class="label-f">PRICE</span><button class="key" data-action="power">yˣ</button><span class="label-g">√x</span></div>
      <div class="key-container"><span class="label-f">YTM</span><button class="key" data-action="reciprocal">1/x</button><span class="label-g">eˣ</span></div>
      <div class="key-container"><span class="label-f">SL</span><button class="key" data-action="pct_total">%T</button><span class="label-g">LN</span></div>
      <div class="key-container"><span class="label-f">SOYD</span><button class="key" data-action="pct_delta">Δ%</button><span class="label-g">FRAC</span></div>
      <div class="key-container"><span class="label-f">DB</span><button class="key" data-action="percent">%</button><span class="label-g">INTG</span></div>
      <div class="key-container"><span class="label-f">ALG</span><button class="key" data-action="EEX">EEX</button><span class="label-g">ΔDYS</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-digit="4">4</button><span class="label-g">D.MY</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-digit="5">5</button><span class="label-g">M.DY</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-digit="6">6</button><span class="label-g"></span></div>
      <div class="key-container"><span class="label-f"></span><button class="key key-operator" data-operator="*">×</button><span class="label-g"></span></div>

<!-- Linha 3 -->
      <div class="key-container"><span class="label-f">P/R</span><button class="key" data-action="RS">R/S</button><span class="label-g">P/R</span></div>
      <div class="key-container"><span class="label-f">Σ</span><button class="key" data-action="SST">SST</button><span class="label-g">BST</span></div>
      <div class="key-container"><span class="label-f">PRGM</span><button class="key" data-action="roll_down">R↓</button><span class="label-g">GTO</span></div>
      <div class="key-container"><span class="label-f">FIN</span><button class="key" data-action="swap">x≷y</button><span class="label-g">x=0</span></div>
      <div class="key-container"><span class="label-f">REG</span><button class="key" data-action="CLx">CLx</button><span class="label-g">x≤y</span></div>
      
      <!-- ENTER ocupa o espaço da linha 3 e linha 4 -->
      <div class="key-container key-container-enter">
        <span class="label-f">PREFIX</span>
        <button class="key key-enter" data-action="ENTER">ENTER</button>
        <span class="label-g">LSTx</span>
      </div>

      <div class="key-container"><span class="label-f"></span><button class="key" data-digit="1">1</button><span class="label-g">x̂,r</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-digit="2">2</button><span class="label-g">ŷ,r</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-digit="3">3</button><span class="label-g">n!</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key key-operator" data-operator="-">−</button><span class="label-g"></span></div>

      <!-- Linha 4 (removido o contêiner repetido do ENTER que ficava abaixo) -->
      <div class="key-container"><span class="label-f">OFF</span><button class="key key-on" data-action="ON">ON</button><span class="label-g"></span></div>
      <div class="key-container"><span class="label-f"></span><button class="key key-modifier-f" data-action="prefix_f">f</button><span class="label-g"></span></div>
      <div class="key-container"><span class="label-f"></span><button class="key key-modifier-g" data-action="prefix_g">g</button><span class="label-g"></span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-action="STO">STO</button><span class="label-g"></span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-action="RCL">RCL</button><span class="label-g"></span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-digit="0">0</button><span class="label-g">x̄</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-action="decimal">.</button><span class="label-g">s</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key" data-action="sigma_plus">Σ+</button><span class="label-g">Σ-</span></div>
      <div class="key-container"><span class="label-f"></span><button class="key key-operator" data-operator="+">+</button><span class="label-g"></span></div>
    </section>
  </main>
</body>
</html>
